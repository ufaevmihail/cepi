<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>симулятор электрических цепей</title>
      <script type="module" crossorigin src="/cepi/assets/index-DuLMOwfE.js"></script>
      <link rel="modulepreload" crossorigin href="/cepi/assets/CanvasPool--v5prlt4.js">
      <link rel="modulepreload" crossorigin href="/cepi/assets/canvasUtils-CVbFN9-F.js">
      <link rel="modulepreload" crossorigin href="/cepi/assets/RenderTargetSystem-C-z1wwb_.js">
      <link rel="modulepreload" crossorigin href="/cepi/assets/getTextureBatchBindGroup-Dsyth7kY.js">
      <link rel="modulepreload" crossorigin href="/cepi/assets/getTexelRangeRects-DJfO-e1L.js">
      <link rel="stylesheet" crossorigin href="/cepi/assets/index-CnsZ1jie.css">
    </head>
    <body>	    
        <div class="simulator-layout" style="display: flex; flex-direction: row; gap: 20px; font-family: sans-serif; padding: 15px; background-color: #f0f0f0; width: fit-content; align-items: flex-start;">
    
    <!-- СЛЕВА: Контейнер для холста PixiJS (ваш canvas добавится сюда скриптом) -->
    <div id="myCanvas" style="border: 2px solid #bdc3c7; border-radius: 8px; overflow: hidden; line-height: 0;"></div>

    <!-- СПРАВА: Панель добавления элементов -->
    <div class="control-panel" style="width: 280px; padding: 20px; background: #ffffff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #e2e8f0;">
        <h3 style="margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 8px; font-size: 18px;">Добавить элемент</h3>
        
        <!-- Выбор типа элемента -->
        <div class="form-group" style="margin-bottom: 15px;">
            <label for="elem-type" style="display: block; margin-bottom: 5px; font-weight: bold; color: #7f8c8d; font-size: 13px;">Тип компонента:</label>
            <select id="elem-type" style="width: 100%; padding: 8px; border: 1px solid #bdc3c7; border-radius: 4px; background: #fff; font-size: 14px; cursor: pointer;">
                <option value="провод">Провод</option>
                <option value="резистор" selected>Резистор</option>
                <option value="конденсатор">Конденсатор</option>
                <option value="катушка">Катушка индуктивности</option>
                <option value="постоянное_эдс">Постоянное ЭДС </option>
                <option value="переменное_эдс">Переменное ЭДС </option>
            </select>
        </div>

        <!-- Динамический контейнер для параметров (заполняется из JS) -->
        <div id="dynamic-fields" style="margin-bottom: 20px;"></div>

        <!-- Кнопка создания -->
        <button id="add-elem-btn" style="width: 100%; padding: 10px; background: #3498db; color: #fff; border: none; border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s;">
            Создать
        </button>
	<div class="simulation-time-panel" style="margin-top: 25px; border-top: 2px solid #ecf0f1; padding-top: 15px; margin-bottom: 15px;">
			<h4 style="margin-top: 0; color: #2c3e50; font-size: 15px; margin-bottom: 10px;">Время симуляции</h4>
			<div class="form-group">
				<label for="sim-time-input" style="display: block; margin-bottom: 5px; font-weight: bold; color: #7f8c8d; font-size: 12px;">Значение (например, 0.2 или 5t):</label>
				<input type="text" id="sim-time-input" value="10t" style="width: 92%; padding: 8px; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 14px;" />
			</div>
		</div>
    </div>
    
</div>
        <button onclick="raschitat()">Расчитать</button>	
		<button onclick="sbros()">Сброс</button>
		
		<div id="chart-container"></div>
		<div id="chart-container1"></div>		
    </body>
</html>
